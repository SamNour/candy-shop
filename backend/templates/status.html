<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Server Status</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background-color: #282c34;
        color: white;
        margin: 0;
      }
      #status {
        color: limegreen;
        font-size: 2em;
        text-align: center;
        animation: pulse 2s infinite;
      }
      @keyframes pulse {
        0% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.1);
        }
        100% {
          transform: scale(1);
        }
      }
    </style>
  </head>
  <body>
    <h1 id="status">Server is running normally.</h1>
  </body>
</html>
