<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Admin Analytics</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        display: flex;
      }
      #sidebar {
        width: 200px;
        height: 100vh;
        background-color: #f0f0f0;
        padding: 20px;
      }
      #content {
        flex-grow: 1;
        padding: 20px;
      }
      .chart {
        width: 100%;
        height: 300px;
        background-color: #ddd;
        margin-bottom: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  </head>
  <body>
    <div id="sidebar">
      <h2>Navigation</h2>
      <ul>
        <li><a href="#">Dashboard</a></li>
        <li><a href="#">Users</a></li>
        <li><a href="#">Products</a></li>
        <li><a href="#">Sales</a></li>
      </ul>
    </div>
    <div id="content">
      <h1>Admin Analytics</h1>
      <div class="chart">
        <canvas id="barChart"></canvas>
      </div>
      <div class="chart">
        <canvas id="lineChart"></canvas>
      </div>
    </div>
    <script>
      var ctx = document.getElementById("barChart").getContext("2d");
      var myChart = new Chart(ctx, {
        type: "bar",
        data: {
          labels: ["Red", "Blue", "Yellow", "Green", "Purple", "Orange"],
          datasets: [
            {
              label: "# of Votes",
              data: [12, 19, 3, 5, 2, 3],
              backgroundColor: [
                "rgba(255, 99, 132, 0.2)",
                "rgba(54, 162, 235, 0.2)",
                "rgba(255, 206, 86, 0.2)",
                "rgba(75, 192, 192, 0.2)",
                "rgba(153, 102, 255, 0.2)",
                "rgba(255, 159, 64, 0.2)",
              ],
              borderColor: [
                "rgba(255, 99, 132, 1)",
                "rgba(54, 162, 235, 1)",
                "rgba(255, 206, 86, 1)",
                "rgba(75, 192, 192, 1)",
                "rgba(153, 102, 255, 1)",
                "rgba(255, 159, 64, 1)",
              ],
              borderWidth: 1,
            },
          ],
        },
        options: {
          scales: {
            y: {
              beginAtZero: true,
            },
          },
        },
      });

      var ctx2 = document.getElementById("lineChart").getContext("2d");
      var myLineChart = new Chart(ctx2, {
        type: "line",
        data: {
          labels: [
            "January",
            "February",
            "March",
            "April",
            "May",
            "June",
            "July",
          ],
          datasets: [
            {
              label: "My First dataset",
              backgroundColor: "rgb(255, 99, 132)",
              borderColor: "rgb(255, 99, 132)",
              data: [0, 10, 5, 2, 20, 30, 45],
            },
          ],
        },
        options: {},
      });
    </script>
  </body>
</html>
